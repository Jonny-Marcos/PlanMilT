services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./bd.db:/var/lib/planmilt/bd.db
      - planmilt-elevation:/var/www/html/SRTM3
    environment:
      PLANMILT_DB_PATH: /var/lib/planmilt/bd.db
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  planmilt-elevation:
