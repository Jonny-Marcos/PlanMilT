<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Visualizador 3D — PlanMilT</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #101820; color: #f3f6f9; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        #terrainCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
        .viewer-header {
            position: fixed; z-index: 2; top: 16px; left: 16px; right: 16px;
            display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
            pointer-events: none;
        }
        .viewer-title, .viewer-controls, #viewerStatus, #viewerWarnings {
            border: 1px solid #ffffff24; border-radius: 10px; background: #17212ddd;
            box-shadow: 0 8px 26px #0005; backdrop-filter: blur(8px);
        }
        .viewer-title { padding: 12px 16px; }
        .viewer-title h1 { margin: 0; font-size: 17px; }
        .viewer-title p { margin: 5px 0 0; color: #bdc9d5; font-size: 12px; }
        .viewer-controls { width: min(250px, calc(100vw - 32px)); padding: 12px; pointer-events: auto; }
        .viewer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        button {
            min-height: 36px; border: 1px solid #ffffff38; border-radius: 6px; padding: 7px 10px;
            background: #28394b; color: #fff; font-size: 13px; cursor: pointer;
        }
        button:hover { background: #344b62; }
        button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #9cc8ff; outline-offset: 2px; }
        .viewer-control { display: block; margin-top: 10px; font-size: 12px; color: #e0e7ef; }
        .viewer-control input { display: block; width: 100%; margin: 8px 0 0; accent-color: #83b9f4; }
        .viewer-control select { display: block; width: 100%; margin: 8px 0 0; padding: 6px; }
        #viewerAttribution { margin: 10px 0 0; color: #bdc9d5; font-size: 11px; }
        #viewerAttribution a { color: #bdc9d5; }
        #viewerStatus, #viewerWarnings {
            position: fixed; z-index: 2; left: 16px; bottom: 16px; max-width: min(600px, calc(100vw - 32px));
            padding: 10px 14px; font-size: 13px; line-height: 1.45;
        }
        #viewerStatus[hidden], #viewerWarnings[hidden] { display: none; }
        #viewerStatus { color: #e3edf8; }
        #viewerWarnings { bottom: 66px; color: #ffe4a8; background: #382e19e8; }
        @media (max-width: 600px) {
            .viewer-header { top: 8px; left: 8px; right: 8px; gap: 8px; }
            .viewer-title { padding: 9px 10px; }
            .viewer-title h1 { font-size: 15px; }
            .viewer-title p { max-width: 150px; }
            .viewer-controls { width: 188px; padding: 8px; }
            .viewer-actions { flex-wrap: wrap; margin-bottom: 6px; }
            .viewer-actions button { min-height: 32px; font-size: 12px; }
            #viewerStatus, #viewerWarnings { left: 8px; max-width: calc(100vw - 16px); }
            #viewerWarnings { bottom: 75px; }
        }
    </style>
</head>
<body>
    <canvas id="terrainCanvas" aria-label="Mapa 3D somente para visualização"></canvas>
    <header class="viewer-header">
        <div class="viewer-title">
            <h1>Visualizador 3D PlanMilT</h1>
            <p>Visualização somente leitura do mapa e dos dados SRTM3 locais.</p>
        </div>
        <aside class="viewer-controls" aria-label="Controles do visualizador">
            <div class="viewer-actions">
                <button id="refreshViewer" type="button" title="Atualizar com o mapa 2D">Atualizar</button>
                <button id="resetCamera" type="button">Restaurar vista</button>
                <button id="closeViewer" type="button">Voltar ao mapa</button>
            </div>
            <label class="viewer-control" for="verticalExaggeration">
                Exagero vertical: <span id="verticalExaggerationValue">5×</span>
                <input id="verticalExaggeration" type="range" min="1" max="10" step="0.5" value="5">
            </label>
            <label class="viewer-control" for="baseLayer3D">
                Camada-base
                <select id="baseLayer3D">
                    <option value="opentopo">OpenTopoMap</option>
                    <option value="bdgex">BDGEx - CTM50</option>
                </select>
            </label>
            <p id="viewerAttribution"></p>
        </aside>
    </header>
    <div id="viewerWarnings" role="status" aria-live="polite" hidden></div>
    <div id="viewerStatus" role="status" aria-live="polite">Abra o visualizador pelo botão 3D no mapa PlanMilT.</div>
    <script src="js/features/map-3d-geometry.js?v=20261112-drawings"></script>
    <script src="js/features/map-3d-viewer.js?v=20261112-drawings"></script>
</body>
</html>
