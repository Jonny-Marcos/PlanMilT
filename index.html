        <link rel="stylesheet" href="css/app.css?v=20261019-editor-drag-mode">
        <title>PlanMilT</title>
    </head>
    <body>
        <div id="map">
        </div>
        <section id="imageEditor" class="image-editor-overlay" aria-label="Criador de tema" hidden>
            <div id="imageEditorMap" class="image-editor-map"></div>
            <canvas id="imageEditorCanvas"></canvas>
            <div id="imageEditorDropHint" class="image-editor-drop-hint">
                Solte uma imagem aqui ou escolha <strong>Enviar imagem</strong>
            </div>
            <button id="closeImageEditor" class="image-editor-close" type="button" aria-label="Voltar ao mapa principal">
                <i class="fas fa-arrow-left" aria-hidden="true"></i>
                Voltar ao mapa
            </button>
            <div id="imageEditorTools" class="toolbar-icons">
                <input type="file" id="imageEditorFile" accept="image/*" hidden>
                <label for="imageEditorFile" class="image-editor-button">
                    <i class="fas fa-upload" aria-hidden="true"></i>
                    Enviar imagem
                </label>
                <button id="imageEditorMode" class="image-editor-button" type="button" aria-pressed="false">
                    <i class="fas fa-arrows-alt" aria-hidden="true"></i>
                    <span id="imageEditorModeLabel">Mover mapa</span>
                </button>
                <span id="imageEditorHint" class="image-editor-hint" hidden></span>
                <details class="image-editor-adjustments">
                    <summary>Ajustes</summary>
                    <label class="image-editor-slider">
                        <span>Contraste</span>
                        <input type="range" id="imageEditorContrast" min="0" max="2" step="0.01" value="1">
                    </label>
                    <label class="image-editor-slider">
                        <span>Brilho</span>
                        <input type="range" id="imageEditorBrightness" min="0" max="2" step="0.01" value="1">
                    </label>
                    <button class="image-editor-button" type="button" data-image-editor-action="remove-background">Remover fundo</button>
                    <button class="image-editor-button" type="button" data-image-editor-action="grayscale">Escala de cinza</button>
                    <button class="image-editor-button" type="button" data-image-editor-action="reset">Redefinir ajustes</button>
                    <button class="image-editor-button" type="button" data-image-editor-action="remove">Remover imagem</button>
                </details>
                <button class="image-editor-button image-editor-save" type="button" data-image-editor-action="save">
                    <i class="fas fa-save" aria-hidden="true"></i>
                    Salvar tema
                </button>
            </div>
        </section>
        <div id="elevation-profile-container" style="display: none; position: relative;">
            <button id="close-btn" style="position: absolute; top: 0; right: 0;">Fechar</button>
            <canvas id="elevation-profile-canvas" width="400" height="200"></canvas>
        </div>
        <button id="toggleControlsBtn" class="toggle-controls">Mostrar Controles</button>




        <!-- Folha de estilos dos ícones Font Awesome. -->
